<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rassegna ER</title>
<meta name="theme-color" content="#8f2a22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#f6f4f1; --surface:#ffffff; --ink:#1d1b1a; --muted:#6b6560; --line:#e3ded8;
  --accent:#8f2a22; --accent-ink:#ffffff; --active:#f3e3dc; --chip:#ece7e1;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --player-h:132px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161413; --surface:#211e1c; --ink:#ece7e2; --muted:#a39b94; --line:#35302c;
  --accent:#e2735f; --accent-ink:#1a1210; --active:#3a2621; --chip:#2b2724; color-scheme:dark } }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Testata */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 16px 6px;max-width:760px;margin:0 auto}
.brand{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0}
.brand span{color:var(--accent)}
.dateline{min-width:0;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3}
.dateline b{display:block;color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;max-width:760px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-family:var(--f-ui);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink)}

/* Contenuto */
main{max-width:760px;margin:0 auto;padding:8px 16px calc(var(--player-h) + 40px)}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:28px 0 4px;color:var(--accent);text-wrap:balance;scroll-margin-top:120px}
.sub-title{font-family:var(--f-display);font-weight:600;font-size:20px;margin:18px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line);text-wrap:balance;scroll-margin-top:120px}
.item{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:12px 8px 12px 4px;border-bottom:1px solid var(--line);border-radius:8px;scroll-margin-top:130px}
.item .txt{min-width:0}
.item .txt p{margin:0}
.pbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;margin-top:2px}
.pbtn svg{width:14px;height:14px;fill:var(--ink)}
.item.reading{background:var(--active);border-bottom-color:transparent}
.item.reading .pbtn{background:var(--accent);border-color:var(--accent)}
.item.reading .pbtn svg{fill:var(--accent-ink)}

/* Lettore Audio */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgb(0 0 0 / .08)}
.player-in{max-width:760px;margin:0 auto;display:grid;gap:8px}
.now{font-family:var(--f-ui);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;min-width:0}
.now span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.now b{color:var(--ink);font-weight:600}
.bar{height:6px;cursor:pointer;background:var(--chip);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctl{border:0;background:transparent;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ctl svg{width:24px;height:24px;fill:var(--ink)}
.ctl.main{width:64px;height:64px;background:var(--accent)}
.ctl.main svg{width:28px;height:28px;fill:var(--accent-ink)}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;height:40px;min-width:64px;padding:0 12px;font-family:var(--f-ui);font-weight:600;font-size:15px;cursor:pointer}
.mid{display:flex;align-items:center;gap:4px}

.toolbar{display:flex;align-items:center;gap:6px;max-width:760px;margin:0 auto;padding:0 16px 4px}
.datebtn{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-ui);font-size:15px;text-align:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 2px}
.pdfbtn{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:34px;padding:0 14px;font-family:var(--f-ui);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pdfbtn svg{width:16px;height:16px;fill:currentColor}

@media print {
  .top, .player, .pbtn { display: none !important; }
  main { padding: 0 !important; max-width: 100% !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="masthead">
    <h1 class="brand">Rassegna <span>ER</span></h1>
    <div class="dateline"><b>Emilia-Romagna</b><span id="durTxt">caricamento...</span></div>
  </div>
  <div class="toolbar">
    <button class="datebtn" id="dateBtn" type="button"><b id="dateTxt">Caricamento edizione...</b></button>
    <button class="pdfbtn" id="pdfBtn" type="button" onclick="window.print()"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>PDF</button>
  </div>
  <nav class="chips" id="chips"></nav>
</header>

<main id="main">
  <div id="list">Caricamento in corso...</div>
</main>

<div class="player" role="region" aria-label="Lettore">
  <div class="player-in">
    <div class="now"><span id="nowSec"><b>Pronto</b> · tocca play per ascoltare</span><span id="nowPos">0:00 / 0:00</span></div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="controls">
      <button class="pill" id="rateBtn" type="button">1×</button>
      <div class="mid">
        <button class="ctl main" id="playBtn" type="button" aria-label="Ascolta"><svg id="playIco" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      </div>
      <button class="pill" id="audioStat" type="button" disabled>MP3</button>
    </div>
  </div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const audio=$('#audioPlayer');
  let playing=false;
  
  function fmtTime(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

  // 1. Legge index.json per trovare l'ultima edizione
  fetch('index.json?v=' + Date.now())
    .then(r=>r.json())
    .then(data=>{
      if(data.latest){
        loadEdition(data.latest);
      }
    })
    .catch(e=>console.error('Errore index.json', e));

  function loadEdition(isoDate){
    $('#dateTxt').textContent = isoDate;
    
    // Carica il contenuto HTML dell'edizione
    fetch(`edizioni/${isoDate}.html`)
      .then(r=>r.text())
      .then(html=>{
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const content = doc.querySelector('main') || doc.body;
        $('#list').innerHTML = content.innerHTML;
        buildSections();
      });

    // Collega il file audio MP3 corrispondente
    audio.src = `audio/${isoDate}.mp3`;
    $('#audioStat').textContent = 'MP3 OK';
  }

  function buildSections(){
    const list = $('#list');
    const sections = list.querySelectorAll('h2, h3');
    const chips = $('#chips');
    chips.innerHTML = '';
    
    sections.forEach((sec, idx)=>{
      sec.id = 'sec-' + idx;
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = sec.textContent;
      btn.onclick = () => sec.scrollIntoView({behavior:'smooth'});
      chips.appendChild(btn);
    });
  }

  // Controlli Riproduttore Audio MP3
  $('#playBtn').onclick = () => {
    if(playing){
      audio.pause();
      playing = false;
      $('#playIco').innerHTML = '<path d="M8 5v14l11-7z"/>';
    } else {
      audio.play().then(()=>{
        playing = true;
        $('#playIco').innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      }).catch(err => {
        alert('File MP3 in fase di generazione o non ancora pronto per questa edizione.');
      });
    }
  };

  audio.ontimeupdate = () => {
    if(!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    $('#barFill').style.width = pct + '%';
    $('#nowPos').textContent = fmtTime(audio.currentTime) + ' / ' + fmtTime(audio.duration);
  };

  const rates = [1, 1.25, 1.5, 0.85];
  let rateIdx = 0;
  $('#rateBtn').onclick = () => {
    rateIdx = (rateIdx + 1) % rates.length;
    audio.playbackRate = rates[rateIdx];
    $('#rateBtn').textContent = rates[rateIdx] + '×';
  };
})();
</script>
</body>
</html>
