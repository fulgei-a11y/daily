<style>
:root{
  --bg:#f6f4f1; --surface:#ffffff; --ink:#1d1b1a; --muted:#6b6560; --line:#e3ded8;
  --accent:#8f2a22; --accent-ink:#ffffff; --active:#f6e2da; --chip:#ece7e1; --hl:#fff4d6;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --player-h:150px;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#161413; --surface:#211e1c; --ink:#ece7e2; --muted:#a39b94; --line:#35302c;
  --accent:#e2735f; --accent-ink:#1a1210; --active:#3a2621; --chip:#2b2724; --hl:#3b3320; color-scheme:dark } }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Testata ---------- */
.top{background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.navbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:12px}
.brand{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0}
.brand span{color:var(--accent)}
.dateline{min-width:0;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.dateline b{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
.toolbar{display:flex;align-items:center;gap:6px;padding:10px 0 4px}
.icon{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon:disabled{opacity:.35;cursor:default}
.icon svg{width:18px;height:18px;fill:var(--ink)}
.datesel{flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 14px;font-family:var(--f-ui);font-weight:600;font-size:15px;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;cursor:pointer}
.pdfbtn{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:38px;padding:0 14px;font-family:var(--f-ui);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pdfbtn svg{width:16px;height:16px;fill:currentColor}
.search{display:flex;align-items:center;gap:8px;margin:6px 0 2px;height:38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 12px}
.search svg{width:16px;height:16px;fill:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-ui);font-size:15px;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips + .chips{padding-top:0}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-family:var(--f-ui);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip small{font-weight:500;opacity:.7;margin-left:4px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chips.prov .chip{background:transparent;border:1px solid var(--line);font-weight:500;padding:5px 11px}
.chips.prov .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- Contenuto ---------- */
main{max-width:780px;margin:0 auto;padding:4px 16px calc(var(--player-h) + 48px)}
.sec{scroll-margin-top:100px}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:27px;text-transform:uppercase;letter-spacing:.02em;margin:30px 0 4px;color:var(--accent);text-wrap:balance;display:flex;align-items:baseline;gap:10px}
.sec-title small{margin-left:auto;white-space:nowrap;font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;text-transform:none}
.sec.evidenza .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:14px 12px 14px 8px}
.sub-title{font-family:var(--f-display);font-weight:600;font-size:19px;margin:18px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--line);color:var(--ink)}
.item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 8px 12px 4px;border-bottom:1px solid var(--line);border-radius:10px;scroll-margin-top:110px;transition:background .25s}
.item .txt{min-width:0;overflow-wrap:anywhere}
.item .txt p{margin:0}
.item .txt > b:first-child,.item .txt > strong:first-child{font-family:var(--f-ui);font-weight:700}
.sec.notes .item{border:0}
.sec.notes .pbtn{visibility:hidden}
.sec.notes .txt{font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.item .src{display:block;margin-top:4px;font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.item .src a{font-weight:600}
.pbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;margin-top:2px;padding:0}
.pbtn svg{width:13px;height:13px;fill:var(--ink)}
.item.reading{background:var(--active);border-bottom-color:transparent}
.item.reading .pbtn{background:var(--accent);border-color:var(--accent)}
.item.reading .pbtn svg{fill:var(--accent-ink)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.note{font-family:var(--f-ui);font-size:14px;color:var(--muted);background:var(--chip);border-radius:10px;padding:10px 12px}
.empty{font-family:var(--f-ui);color:var(--muted);text-align:center;padding:48px 0}
.skel{height:14px;border-radius:7px;background:var(--chip);margin:16px 0;animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.45}}

.src .sharebtn{border:0;background:none;padding:0 0 0 10px;margin:0;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.src .sharebtn svg{width:13px;height:13px;fill:currentColor}
.src .sharebtn:hover{color:var(--accent)}
.item.target,.sec.evidenza .item.target{background:var(--hl)}
.banner{display:flex;align-items:center;gap:10px;margin:8px 0 2px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-ui);font-size:14px;line-height:1.35}
.banner img{width:36px;height:36px;border-radius:8px;flex:none}
.banner span{flex:1;min-width:0}
.banner .go{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:34px;padding:0 14px;font-weight:600;cursor:pointer}
.banner .x{flex:none;border:0;background:none;width:30px;height:30px;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:0}
.banner.warn{background:var(--hl);border-color:transparent}
.upd{display:flex;align-items:center;gap:8px;margin:4px 0 0;padding-left:2px;font-family:var(--f-ui);font-size:13.5px;line-height:1.35;color:var(--muted);min-height:20px}
.upd b{color:var(--ink);font-weight:600}
.upd .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.upd.fresh .dot{background:#2f8a4e;box-shadow:0 0 0 3px rgb(47 138 78 / .18)}
.upd.late .dot{background:#d08a12;box-shadow:0 0 0 3px rgb(208 138 18 / .2)}
.upd.late{color:var(--ink)}
.upd span{flex:1;min-width:0}
.upd button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:28px;padding:0 11px;font:inherit;font-weight:600;color:var(--accent);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--player-h) + 20px);transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);font-family:var(--f-ui);font-size:14px;padding:9px 16px;border-radius:999px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:1}

/* ---------- Lettore audio ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgb(0 0 0 / .08)}
.player-in{max-width:780px;margin:0 auto;display:grid;gap:8px}
.now{font-family:var(--f-ui);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;min-width:0}
.now span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.now b{color:var(--ink);font-weight:600}
.bar{position:relative;height:8px;cursor:pointer;background:var(--chip);border-radius:4px;overflow:hidden;touch-action:none}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mid{display:flex;align-items:center;gap:6px}
.ctl{border:0;background:transparent;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ctl svg{width:24px;height:24px;fill:var(--ink)}
.ctl.main{width:62px;height:62px;background:var(--accent)}
.ctl.main svg{width:28px;height:28px;fill:var(--accent-ink)}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;height:40px;min-width:64px;padding:0 12px;font-family:var(--f-ui);font-weight:600;font-size:14px;cursor:pointer}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.player.noaudio .controls,.player.noaudio .bar{display:none}

@media (min-width:700px){ body{font-size:17.5px} .brand{font-size:34px} }
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} *{animation:none!important;transition:none!important} }

/* ---------- Stampa / PDF ---------- */
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#ccc;--accent:#7a1f18;--active:#fff;--chip:#fff}
  body{font-size:10.5pt;line-height:1.45}
  .upd button,.top .toolbar,.top .search,.navbar,.chips,.player,.pbtn,.banner,.sharebtn,.toast{display:none!important}
  .printdate{display:block!important;font-family:var(--f-ui);font-weight:600;margin:4pt 0 0}
  .top{position:static;border:0}
  main{padding:0!important;max-width:none}
  .item{display:block;padding:5pt 0;break-inside:avoid;border-radius:0}
  .item[hidden]{display:block!important}
  .sec[hidden],.sub-title[hidden]{display:block!important}
  .sec.evidenza .item{border:0;border-bottom:1px solid var(--line);background:none;margin:0;padding:5pt 0}
  .sec-title{font-size:16pt;margin-top:14pt;break-after:avoid}
  .sub-title{font-size:12.5pt;break-after:avoid}
  .item .src a{text-decoration:none;color:#000}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="masthead">
      <div><h1 class="brand">Rassegna <span>ER</span></h1><p class="printdate" id="printDate" hidden></p></div>
      <div class="dateline"><b>Emilia-Romagna</b><span id="stats">caricamento…</span></div>
    </div>
    <div class="toolbar">
      <button class="icon" id="prevEd" type="button" aria-label="Edizione precedente"><svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
      <select class="datesel" id="dateSel" aria-label="Scegli l'edizione"></select>
      <button class="icon" id="nextEd" type="button" aria-label="Edizione successiva"><svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
      <button class="icon" id="shareBtn" type="button" aria-label="Condividi l'edizione"><svg viewBox="0 0 24 24"><path d="M18 16.1c-.8 0-1.4.3-2 .8l-7.1-4.2c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8a3 3 0 1 0-3-3c0 .2 0 .5.1.7L8 9.8A3 3 0 1 0 8 14.2l7.1 4.2c0 .2-.1.4-.1.6a2.9 2.9 0 1 0 3-2.9"/></svg></button>
      <button class="pdfbtn" id="pdfBtn" type="button"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>PDF</button>
    </div>
    <p class="upd" id="upd" aria-live="polite"><i class="dot"></i><span id="updTxt">&nbsp;</span><button id="toLatest" type="button" hidden>Vai all'ultima</button></p>
    <label class="search" style="margin-top:10px"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9"/></svg><input id="q" type="search" placeholder="Cerca nella rassegna (es. alluvione, Bologna, sanità)" autocomplete="off"></label>
    <div class="banner" id="installBar" hidden><img src="icons/icon-192.png" alt=""><span id="installTxt"></span><button class="go" id="installGo" type="button">Installa</button><button class="x" id="installX" type="button" aria-label="Chiudi">×</button></div>
  </div>
</header>
<div class="navbar">
  <div class="wrap">
    <nav class="chips" id="secChips" aria-label="Sezioni"></nav>
    <nav class="chips prov" id="provChips" aria-label="Province"></nav>
  </div>
</div>

<main id="main"><div class="skel"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:60%"></div></main>

<div class="player" id="player" role="region" aria-label="Lettore audio">
  <div class="player-in">
    <div class="now"><span id="nowTxt"><b>Ascolta la rassegna</b> · voce Paola</span><span id="nowPos">0:00 / 0:00</span></div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="controls">
      <button class="pill" id="rateBtn" type="button" aria-label="Velocità">1×</button>
      <div class="mid">
        <button class="ctl" id="prevItem" type="button" aria-label="Notizia precedente"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="ctl main" id="playBtn" type="button" aria-label="Ascolta"><svg id="playIco" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="ctl" id="nextItem" type="button" aria-label="Notizia successiva"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <button class="pill on" id="followBtn" type="button" aria-pressed="true" title="Scorre la pagina seguendo la lettura">Segui</button>
    </div>
  </div>
</div>

<audio id="audio" preload="auto" playsinline></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const audio = $('#audio'), main = $('#main');
  const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  let editions = [], current = null, items = [], segs = [], syncOK = false, curIdx = -1;
  let follow = true, lastUserScroll = 0, prov = 'Tutte', focusK = 0;

  const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
                  set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} } };
  const fmt = s => { s = Math.floor(s || 0); return Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0'); };
  const longDate = iso => { const d = new Date(iso + 'T12:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long', year:'numeric' }); };
  const shortDate = iso => { const d = new Date(iso + 'T12:00:00');
    if (isNaN(d)) return iso;
    const y = d.getFullYear() !== new Date().getFullYear();
    return d.toLocaleDateString('it-IT', { weekday:'short', day:'numeric', month: y ? 'short' : 'long', year: y ? 'numeric' : undefined }); };
  // titoli tutti in maiuscolo (vecchie edizioni) → "Prima pagina e politica regionale"
  const nice = t => t === t.toUpperCase() ? t.charAt(0) + t.slice(1).toLowerCase() : t;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---------- Province: ogni notizia riceve la sua, dal titoletto o dal luogo ("Sassuolo (Modena):") ---------- */
  const PROV_ORDER = ['Emilia-Romagna','Bologna','Modena','Reggio Emilia','Parma','Piacenza','Ferrara','Ravenna','Forlì-Cesena','Rimini'];
  const SIGLE = { BO:'Bologna', MO:'Modena', RE:'Reggio Emilia', PR:'Parma', PC:'Piacenza', FE:'Ferrara', RA:'Ravenna', FC:'Forlì-Cesena', RN:'Rimini' };
  const norm = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’`]/g, "'").replace(/\s+/g, ' ').trim();
  const PLACE = new Map();

  const META = {};

  const RUN_UTC_HOUR = 4, PUBLISH_MIN = 20;   // il workflow parte alle 04:00 UTC e pubblica in circa 20 minuti
  const romeTime = d => d.toLocaleTimeString('it-IT', { timeZone: 'Europe/Rome', hour: 'numeric', minute: '2-digit' });
  const romeDay = d => d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Rome' });
  function dayWord(iso){
    if (iso === todayRome()) return 'oggi';

    if (iso === romeDay(new Date(Date.now() + 864e5))) return 'domani';

  function staleCheck(){

    let cls = '', txt;
    if (current === latest){
      const next = nextPublish(), nextTxt = `${dayWord(romeDay(next))} verso le ${romeTime(next)}`;

        cls = 'fresh';
        txt = (when ? `<b>Aggiornata ${when}</b>` : '<b>Edizione di oggi</b>') + ` · prossima: ${nextTxt}`;
      } else {
        // l'edizione di oggi non c'è ancora: "in arrivo" prima dell'orario previsto, "in ritardo" dopo
        const late = romeDay(next) !== todayRome() && Date.now() - (next.getTime() - 864e5) > 40 * 60e3;
        cls = late ? 'late' : '';
        txt = `<b>Ultimo aggiornamento ${when || dayWord(latest)}</b> · ` +

  /* Stessa logica di lettura di build_audio.py: l'indice di ogni notizia coincide con l'audio */
  function walkFragment(root){
    const out = [], st = { sec: null, sub: null };
    const add = n => { if (st.sec === null) st.sec = 'Rassegna'; out.push({ sec: st.sec, sub: st.sub, node: n }); };
    const walk = nodes => {
      for (const n of nodes){
        if (n.nodeType !== 1) continue;
        const t = n.tagName.toLowerCase();
        if (t === 'h2'){ st.sec = n.textContent.trim(); st.sub = null; }
        else if (t === 'h3'){ st.sub = n.textContent.trim(); }
        else if (t === 'p'){ if (!n.classList.contains('note')) add(n); }
        else if (t === 'ol' || t === 'ul'){ for (const li of n.children) if (li.tagName === 'LI') add(li); }
        else if (t === 'div'){
          if (n.classList.contains('foot')){ st.sec = 'Note'; st.sub = null; for (const c of n.children) add(c); }
          else walk(n.childNodes);
        }
      }
    };
    walk(root.childNodes);
    return out;
  }

  function render(html){

        const h = document.createElement('h3');
        h.className = 'sub-title'; h.textContent = it.sub; h.dataset.prov = it.sub;

  function buildChips(){

      $('#secChips').appendChild(b);
    });
    const counts = {};
    items.forEach(el => { const p = el.dataset.prov; if (p) counts[p] = (counts[p] || 0) + 1; });
    const provs = ['Tutte', ...PROV_ORDER.filter(p => counts[p])];
    // la provincia scelta resta memorizzata; se oggi non ha notizie si mostrano tutte
    const wanted = store.get('prov') || 'Tutte';

      b.innerHTML = esc(p) + (p === 'Tutte' ? '' : `<small>${counts[p]}</small>`);
      b.setAttribute('aria-pressed', p === prov);
      b.onclick = () => { setProv(p); applyFilters(); if (p !== 'Tutte') toast(`Solo ${p}: la scelta resta memorizzata`); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      $('#provChips').appendChild(b);
    });
    observeSections();
    const on = $('#provChips .chip.on');
    if (on && prov !== 'Tutte') requestAnimationFrame(() => on.scrollIntoView({ block: 'nearest', inline: 'center' }));
  }
  function setProv(p, save = true){
    prov = p;
    if (save) store.set('prov', p);
    [...$('#provChips').children].forEach(c => { const on = c.dataset.p === p; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
  }

  function applyFilters(){
    const q = $('#q').value.trim().toLowerCase();
    items.forEach(el => {
      const okProv = prov === 'Tutte' || el.dataset.prov === prov;
      el.hidden = !(okProv && (!q || el.dataset.text.includes(q)));
      const txt = el.querySelector('.txt');
      if (!txt.dataset.orig) txt.dataset.orig = txt.innerHTML;
      txt.innerHTML = txt.dataset.orig;
      if (q && !el.hidden) highlight(txt, q);
    });
    main.querySelectorAll('.sec').forEach(s => {
      const n = s.querySelectorAll('.item:not([hidden])').length;
      s.hidden = n === 0;
      s.querySelector('.sec-title small').textContent = n ? n + (n === 1 ? ' notizia' : ' notizie') : '';
      const chip = $(`#secChips [data-target="${s.id}"]`);
      if (chip){ chip.hidden = n === 0; chip.querySelector('small').textContent = n; }
      s.querySelectorAll('.sub-title').forEach(h => {
        let el = h.nextElementSibling, any = false;
        while (el && el.classList.contains('item')){ if (!el.hidden) any = true; el = el.nextElementSibling; }
        h.hidden = !any;
      });
    });
    let msg = $('#noResults');
    const none = items.length && !items.some(el => !el.hidden);
    if (none && !msg) main.insertAdjacentHTML('beforeend', '<p class="empty" id="noResults">Nessuna notizia corrisponde alla ricerca.</p>');
    if (!none && msg) msg.remove();
    msg = $('#noResults');
    if (msg) msg.textContent = prov !== 'Tutte' && !q ? `Nessuna notizia per ${prov} in questa edizione.` : 'Nessuna notizia corrisponde alla ricerca.';
    updateStats();
    updateNow();
  }
  function highlight(root, q){
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const hits = [];
    while (walker.nextNode()){ const n = walker.currentNode; if (n.nodeValue.toLowerCase().includes(q)) hits.push(n); }
    hits.forEach(n => {
      const i = n.nodeValue.toLowerCase().indexOf(q);
      const m = document.createElement('mark');
      const after = n.splitText(i); after.splitText(q.length);
      m.textContent = after.nodeValue; after.replaceWith(m);
    });
  }
  let qTimer; $('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(applyFilters, 150); });

  let io;
  function observeSections(){
    if (io) io.disconnect();
    io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting){
        [...$('#secChips').children].forEach(c => { const on = c.dataset.target === e.target.id; c.classList.toggle('on', on);
          if (on) c.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); });
      } });
    }, { rootMargin: '-35% 0px -60% 0px' });
    main.querySelectorAll('.sec').forEach(s => io.observe(s));
  }

  /* ---------- Audio sincronizzato ---------- */
  async function loadAudio(date){
    segs = []; syncOK = false; curIdx = -1;
    $('#player').classList.remove('noaudio');
    let meta = null;
    try { const r = await fetch(`audio/${date}.json?v=${Date.now()}`); if (r.ok) meta = await r.json(); } catch(e) {}
    if (!meta){
      $('#player').classList.add('noaudio');
      $('#nowTxt').innerHTML = '<b>Audio non disponibile</b> per questa edizione';
      $('#nowPos').textContent = '';
      audio.removeAttribute('src');
      items.forEach(el => el.querySelector('.pbtn').hidden = true);
      return;
    }
    audio.src = meta.audio || `audio/${date}.mp3`;
    segs = (meta.segments || []).slice().sort((a, b) => a.t - b.t);
    syncOK = segs.length > 0 && meta.items === items.length;
    audioDur = meta.duration || 0;
    updateNow();
    $('#nowPos').textContent = '0:00 / ' + fmt(meta.duration);
    const saved = parseFloat(store.get('pos-' + date));
    if (saved > 5) audio.addEventListener('loadedmetadata', () => { audio.currentTime = saved; }, { once: true });
    items.forEach(el => el.querySelector('.pbtn').hidden = !syncOK);
    setupMediaSession(date);
  }

  let audioDur = 0;
  const filtering = () => prov !== 'Tutte' || !!$('#q').value.trim();
  const visibleSeg = j => { const el = items[segs[j].i]; return el && !el.hidden; };
  function nextVisibleSeg(from){ for (let j = Math.max(from, 0); j < segs.length; j++) if (visibleSeg(j)) return j; return -1; }
  function prevVisibleSeg(from){ for (let j = from; j >= 0; j--) if (visibleSeg(j)) return j; return -1; }
  // testo del lettore quando non sta leggendo una notizia precisa
  function updateNow(){
    if (!segs.length || (!audio.paused && curIdx >= 0)) return;
    if (syncOK && filtering()){
      const n = segs.filter((x, j) => visibleSeg(j)).length;
      $('#nowTxt').innerHTML = n ? `<b>Ascolta solo ${esc(prov !== 'Tutte' ? prov : 'i risultati')}</b> · ${n} ${n === 1 ? 'notizia' : 'notizie'}`
                                 : '<b>Nessuna notizia da ascoltare</b> con questo filtro';
    } else $('#nowTxt').innerHTML = `<b>Ascolta la rassegna</b> · ${fmt(audioDur)} · voce Paola`;
  }

  function segIndexAt(t){
    let lo = 0, hi = segs.length - 1, ans = -1;
    while (lo <= hi){ const m = (lo + hi) >> 1; if (segs[m].t <= t + 0.05){ ans = m; lo = m + 1; } else hi = m - 1; }
    return ans;
  }
  function playFrom(i){
    const s = segs.find(x => x.i === i);
    if (!s) return;
    audio.currentTime = s.t; lastUserScroll = 0; play();
  }
  function play(){
    // con un filtro attivo si parte dalla prima notizia visibile
    if (syncOK && filtering()){
      const k = segIndexAt(audio.currentTime);
      if (k < 0 || !visibleSeg(k)){ const j = nextVisibleSeg(k + 1); if (j < 0){ toast('Nessuna notizia da ascoltare con questo filtro'); return; } audio.currentTime = segs[j].t; }
    }
    wantPlay = true;
    audio.play().then(() => setPlayIcon(true)).catch(() => { wantPlay = false;
    $('#nowTxt').innerHTML = '<b>Audio non ancora pronto</b> · riprova tra qualche minuto'; }); }
  // pausa voluta dall'utente (pulsante, cuffie, schermata di blocco): solo questa ferma davvero l'ascolto
  function userPause(){ wantPlay = false; audio.pause(); }
  function setPlayIcon(on){ $('#playIco').innerHTML = on ? PAUSE : PLAY; $('#playBtn').setAttribute('aria-label', on ? 'Pausa' : 'Ascolta'); }

  $('#playBtn').onclick = () => audio.paused ? play() : userPause();

  /* ---------- Ascolto a schermo spento ----------
     Alcuni telefoni sospendono l'audio quando lo schermo si spegne o la rete cambia (Wi-Fi → dati).
     Se la pausa non l'ha chiesta l'utente, l'ascolto riprende da solo dal punto in cui era. */
  let wantPlay = false, lastT = -1, stuck = 0, hiddenAt = 0, retries = 0;
  document.addEventListener('visibilitychange', () => { hiddenAt = document.hidden ? Date.now() : 0; });
  const setState = st => { if ('mediaSession' in navigator) try { navigator.mediaSession.playbackState = st; } catch(e) {} };
  function updatePosition(){
    if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState || !audio.duration) return;
    try { navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, audio.duration) }); } catch(e) {}
  }
  function resume(reload){
    if (!wantPlay || audio.ended || !audio.src) return;
    const t = audio.currentTime;
    if (reload){ audio.src = audio.src.split('#')[0]; audio.addEventListener('loadedmetadata', () => { audio.currentTime = t; }, { once: true }); }
    audio.play().catch(() => {});
  }
  audio.onpause = () => {
    setPlayIcon(false); setState('paused'); store.set('pos-' + current, audio.currentTime);
    // riprende solo se la pausa è arrivata insieme allo spegnimento dello schermo
    // (non dopo una telefonata o se si staccano le cuffie)
    if (wantPlay && !audio.ended && hiddenAt && Date.now() - hiddenAt < 4000 && retries < 3){
      retries++; setTimeout(() => { if (audio.paused) resume(false); }, 600);
    } else if (wantPlay) wantPlay = false;
  };
  audio.onplay = () => { setPlayIcon(true); setState('playing'); updatePosition(); };
  audio.addEventListener('playing', () => { setTimeout(() => { if (!audio.paused) retries = 0; }, 5000); });
  audio.onended = () => { wantPlay = false; setPlayIcon(false); setState('none'); store.set('pos-' + current, 0); };
  audio.addEventListener('error', () => { if (wantPlay) setTimeout(() => resume(true), 1500); });
  audio.addEventListener('ratechange', updatePosition);
  audio.addEventListener('seeked', updatePosition);
  // sorveglianza: se l'audio risulta "in riproduzione" ma resta fermo (rete persa), lo ricarica
  setInterval(() => {
    if (!wantPlay || audio.ended) { stuck = 0; return; }
    if (audio.paused) return;
    stuck = Math.abs(audio.currentTime - lastT) < 0.1 ? stuck + 1 : 0;
    lastT = audio.currentTime;
    if (stuck >= 3) { stuck = 0; resume(true); }
  }, 4000);

  $('#prevItem').onclick = () => { const k = segIndexAt(audio.currentTime), f = syncOK && filtering();
    if (k >= 0 && audio.currentTime - segs[k].t > 3 && (!f || visibleSeg(k))) { audio.currentTime = segs[k].t; return; }
    const j = f ? prevVisibleSeg(k - 1) : k - 1;
    audio.currentTime = j >= 0 ? segs[j].t : (f ? audio.currentTime : 0); };
  $('#nextItem').onclick = () => { const k = segIndexAt(audio.currentTime);
    const j = syncOK && filtering() ? nextVisibleSeg(k + 1) : (k + 1 < segs.length ? k + 1 : -1);
    if (j >= 0) audio.currentTime = segs[j].t; };

  let saveTick = 0;
  audio.ontimeupdate = () => {
    const d = audio.duration || 0;
    $('#barFill').style.width = d ? (audio.currentTime / d * 100) + '%' : '0';
    $('#nowPos').textContent = fmt(audio.currentTime) + ' / ' + fmt(d);
    if (++saveTick % 8 === 0) store.set('pos-' + current, audio.currentTime);
    if (!syncOK) return;
    const k = segIndexAt(audio.currentTime);
    // ascolto filtrato: salta le notizie nascoste
    if (!audio.paused && filtering() && k >= 0 && !visibleSeg(k)){
      const j = nextVisibleSeg(k + 1);
      if (j < 0){ userPause(); toast(prov !== 'Tutte' ? `Fine delle notizie di ${prov}` : 'Fine dei risultati'); }
      else audio.currentTime = segs[j].t;
      return;
    }
    const idx = k >= 0 ? segs[k].i : -1;
    if (idx === curIdx) return;
    if (items[curIdx]) items[curIdx].classList.remove('reading');
    curIdx = idx;
    const el = items[idx];
    if (!el) return;
    el.classList.add('reading');
    const sec = el.closest('.sec').dataset.title, sub = el.dataset.prov;
    $('#nowTxt').innerHTML = `<b>${esc(sec)}</b>${sub ? ' · ' + esc(sub) : ''} · ${idx + 1}/${items.length}`;
    if ('mediaSession' in navigator && navigator.mediaSession.metadata) try { navigator.mediaSession.metadata.artist = sec + (sub ? ' · ' + sub : ''); } catch(e) {}
    if (follow && !el.hidden && Date.now() - lastUserScroll > 5000) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  ['wheel', 'touchmove'].forEach(ev => window.addEventListener(ev, () => { lastUserScroll = Date.now(); }, { passive: true }));

  const bar = $('#bar');
  const seek = e => { const r = bar.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    if (audio.duration) audio.currentTime = Math.max(0, Math.min(1, x / r.width)) * audio.duration; };
  bar.addEventListener('pointerdown', e => { seek(e); bar.setPointerCapture(e.pointerId); bar.onpointermove = seek; });
  bar.addEventListener('pointerup', () => { bar.onpointermove = null; });

  const rates = [1, 1.25, 1.5, 1.75, 0.85];
  let rateIdx = Math.max(0, rates.indexOf(parseFloat(store.get('rate')) || 1));
  const applyRate = () => { audio.playbackRate = rates[rateIdx]; $('#rateBtn').textContent = rates[rateIdx] + '×'; };
  applyRate();
  audio.addEventListener('loadedmetadata', applyRate);
  $('#rateBtn').onclick = () => { rateIdx = (rateIdx + 1) % rates.length; store.set('rate', rates[rateIdx]); applyRate(); };

  $('#followBtn').onclick = () => { follow = !follow; $('#followBtn').classList.toggle('on', follow);
    $('#followBtn').setAttribute('aria-pressed', follow); lastUserScroll = 0; };

  function setupMediaSession(date){
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Rassegna ER · ' + longDate(date), artist: 'Emilia-Romagna', album: 'Rassegna stampa',
      artwork: [{ src: 'icons/icon-192.png', sizes: '192x192', type: 'image/png' }, { src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png' }] });
    const h = { play: play, pause: userPause, stop: userPause,
      seekto: d => { if (d.seekTime != null) audio.currentTime = d.seekTime; },
      previoustrack: () => $('#prevItem').click(), nexttrack: () => $('#nextItem').click(),
      seekbackward: () => { audio.currentTime -= 15; }, seekforward: () => { audio.currentTime += 15; } };
    for (const k in h) { try { navigator.mediaSession.setActionHandler(k, h[k]); } catch(e) {} }
  }

  function updateStats(){
    const all = items.filter(el => !el.closest('.notes'));
    const vis = all.filter(el => !el.hidden).length;
    const n = all.length;
    $('#stats').textContent = !n ? '' : vis < n ? `${vis} di ${n} notizie` : `${n} notizie` + (segs.length ? ' · con audio' : '');
  }

  $('#pdfBtn').onclick = () => { const q = $('#q'); const v = q.value; const p = prov;
    // in stampa tutte le notizie, senza filtri
    q.value = ''; setProv('Tutte', false); applyFilters(); window.print();
    setTimeout(() => { q.value = v; setProv(p, false); applyFilters(); }, 500); };

  /* ---------- App installabile ---------- */
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let installEvt = null;
  function showInstall(ios){
    if (standalone || store.get('installNo')) return;
    $('#installTxt').innerHTML = ios
      ? 'Tienila sul telefono come un\'app: tocca <b>Condividi</b> e poi <b>Aggiungi alla schermata Home</b>.'
      : 'Installa <b>Rassegna ER</b> sul telefono o sul computer: si apre come un\'app.';
    $('#installGo').hidden = ios;
    $('#installBar').hidden = false;
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(false); });
  window.addEventListener('appinstalled', () => { $('#installBar').hidden = true; toast('Rassegna ER è installata'); });
  $('#installGo').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; $('#installBar').hidden = true; };
  $('#installX').onclick = () => { store.set('installNo', '1'); $('#installBar').hidden = true; };
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS && /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent)) setTimeout(() => showInstall(true), 2500);
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

  init();
})();
</script>
</body>
</html>
