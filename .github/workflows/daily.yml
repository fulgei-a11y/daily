name: Rassegna Stampa Automatica

on:
  schedule:
    # Esegue ogni mattina alle 07:00 italiane (05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permette l'avvio manuale con un click

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install sherpa-onnx requests beautifulsoup4 google-genai

      - name: Genera la Rassegna e l'Audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TODAY=$(date +'%Y-%m-%d')
          
          # Entra nella cartella tools ed esegue lo scraping
          cd tools
          python3 fetch_and_analyze.py
          
          # Torna alla cartella principale ed esegue la sintesi audio
          cd ..
          python3 tools/build_audio.py --html edizioni/$TODAY.html --audio-out audio/$TODAY.mp3 --json-out edizioni/$TODAY.json
          
          # Aggiorna il file index.json
          echo "{\"latest\": \"$TODAY\"}" > index.json

      - name: Pubblica i file aggiornati su GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update rassegna $(date +'%Y-%m-%d')" || exit 0
          git push
