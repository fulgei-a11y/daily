name: Rassegna Stampa Automatica

on:
  schedule:
    # Esegue ogni mattina alle 07:00 italiane (05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permette l'avvio manuale tramite il pulsante "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze di sistema e pacchetti Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg dos2unix
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai

      - name: Genera Rassegna HTML e Audio MP3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TODAY=$(date +'%Y-%m-%d')
          
          # Individua i percorsi reali dei file ignorando differenze tra maiuscole/minuscole
          FETCH_SCRIPT=$(find . -maxdepth 3 -iname "fetch_and_analyze.py" | head -n 1)
          BUILD_SCRIPT=$(find . -maxdepth 3 -iname "build_audio.py" | head -n 1)
          
          echo "Script di analisi individuato: $FETCH_SCRIPT"
          echo "Script audio individuato: $BUILD_SCRIPT"
          
          if [ -z "$FETCH_SCRIPT" ]; then
            echo "CRITICO: Impossibile trovare fetch_and_analyze.py nel repository."
            echo "Mappa attuale delle cartelle:"
            ls -R
            exit 1
          fi
          
          # Normalizza eventuali caratteri di fine riga Windows (CRLF -> LF)
          dos2unix "$FETCH_SCRIPT"
          if [ -n "$BUILD_SCRIPT" ]; then
            dos2unix "$BUILD_SCRIPT"
          fi
          
          # 1. Esegue lo scraping e genera l'HTML dell'edizione
          python3 "$FETCH_SCRIPT"
          
          # 2. Esegue la generazione audio se lo script e la relativa cartella esistono
          if [ -n "$BUILD_SCRIPT" ]; then
            python3 "$BUILD_SCRIPT" --html edizioni/$TODAY.html --date $TODAY --out audio
          fi
          
          # 3. Aggiorna l'indice dell'ultima edizione per la PWA
          echo "{\"latest\": \"$TODAY\"}" > index.json

      - name: Pubblica gli aggiornamenti su GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update rassegna $(date +'%Y-%m-%d')" || exit 0
          git pull origin main --rebase
          git push origin main
