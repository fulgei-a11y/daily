name: Rassegna Stampa Automatica

on:
  schedule:
    - cron: '0 4 * * *'    # edizione del mattino: 06:00 ora legale (05:00 con l'ora solare)
    # aggiornamenti: GitHub usa l'ora UTC, quindi ogni appuntamento ha due orari
    # (uno per l'ora legale, uno per l'ora solare); lo script parte solo con quello giusto
    - cron: '0 11 * * *'   # 13:00 ora legale
    - cron: '0 12 * * *'   # 13:00 ora solare
    - cron: '0 17 * * *'   # 19:00 ora legale
    - cron: '0 18 * * *'   # 19:00 ora solare  (e In breve delle 20 con l'ora legale)
    # In breve (solo agenzie) alle 8, 12, 16, 20 e 24 ora italiana
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 10 * * *'   # (le 12 con l'ora solare usano il cron delle 11)
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  # quando carichi a mano un file (pagina, icone...) il sito si ripubblica da solo
  push:
    branches: [main]
    paths-ignore: ['edizioni/**', 'audio/**', 'index.json', 'stato.json', 'ultimora.json', 'podcast.xml']
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Cosa generare'
        type: choice
        default: automatico
        options: [automatico, mattina, '13', '19', ultimora, sito]

# due esecuzioni insieme si accodano invece di scontrarsi
concurrency:
  group: rassegna
  cancel-in-progress: false

env:
  AUDIO_DAYS: '19'   # giorni di audio tenuti online (i testi restano tutti)

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write      # per l'avviso automatico in caso di errore
      pages: read        # per sapere da quale ramo è pubblicato il sito

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v5
        with:
          ref: main

      # mattina, 13, 19, ultimora (In breve), sito (solo ripubblicazione) oppure salta
      - name: Decide cosa generare
        id: slot
        env:
          TIPO: ${{ github.event.inputs.tipo }}
          CRON: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          H=$(TZ=Europe/Rome date +'%-H')
          TODAY=$(TZ=Europe/Rome date +'%Y-%m-%d')
          if [ "$EVENT" = "push" ]; then
            SLOT=sito
          elif [ -n "$TIPO" ] && [ "$TIPO" != "automatico" ]; then
            SLOT="$TIPO"
          elif [ -n "$TIPO" ]; then
            if   [ "$H" -lt 12 ]; then SLOT=mattina
            elif [ "$H" -lt 18 ]; then SLOT=13
            else SLOT=19; fi
          elif [ "$CRON" = "0 4 * * *" ]; then
            SLOT=mattina
          elif [ "$H" -ge 13 ] && [ "$H" -le 14 ] && [ ! -f "edizioni/$TODAY-13.html" ]; then
            SLOT=13
          elif [ "$H" -ge 19 ] && [ "$H" -le 20 ] && [ ! -f "edizioni/$TODAY-19.html" ]; then
            SLOT=19
          elif [ "$H" = 8 ] || [ "$H" = 12 ] || [ "$H" = 16 ] || [ "$H" = 20 ] || [ "$H" = 0 ]; then
            SLOT=ultimora
          else
            SLOT=salta
          fi
          AUDIO=no
          case "$SLOT" in mattina|13|19) AUDIO=si ;; esac
          echo "Ora italiana: $H → $SLOT (audio: $AUDIO)"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "audio=$AUDIO" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

      # Gli MP3 non stanno più nella storia del repository (che altrimenti cresce di ~20 MB al giorno):
      # vivono solo nel ramo gh-pages, ricostruito da zero a ogni pubblicazione.
      - name: Recupera l'audio già pubblicato
        if: steps.slot.outputs.slot != 'salta'
        run: |
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD audio 2>/dev/null | tar -x --wildcards 'audio/*.mp3' 2>/dev/null || true
            echo "Audio recuperati: $(ls audio/*.mp3 2>/dev/null | wc -l)"
          else
            echo "Ramo gh-pages non ancora creato: si usano gli audio presenti in main."
          fi

      - name: Configura Python
        if: steps.slot.outputs.slot != 'salta' && steps.slot.outputs.slot != 'sito'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/daily.yml

      - name: Installa dipendenze
        if: steps.slot.outputs.slot != 'salta' && steps.slot.outputs.slot != 'sito'
        run: |
          if [ "${{ steps.slot.outputs.audio }}" = "si" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install -q requests beautifulsoup4 google-genai trafilatura

      # la voce Paola (~100 MB) si scarica una volta sola e poi resta in cache
      - name: Cache della voce Paola
        if: steps.slot.outputs.audio == 'si'
        uses: actions/cache@v4
        with:
          path: ~/.cache/rassegna-tts
          key: paola-tts-1.12.14

      - name: Controlla che gli script siano completi
        if: steps.slot.outputs.slot != 'salta' && steps.slot.outputs.slot != 'sito'
        run: |
          for f in tools/*.py; do
            sed -i 's/\r$//' "$f"
            python -m py_compile "$f" || { echo "❌ $f non è valido: ricaricalo per intero."; exit 1; }
            tail -3 "$f" | grep -q "main()" || { echo "❌ $f è incompleto: ricaricalo per intero."; exit 1; }
          done

      - name: Genera la rassegna (HTML)
        if: steps.slot.outputs.slot != 'salta' && steps.slot.outputs.slot != 'sito'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ steps.slot.outputs.slot }}" = "ultimora" ]; then
            python3 tools/ultimora.py
          else
            python3 tools/fetch_and_analyze.py --slot "${{ steps.slot.outputs.slot }}"
          fi

      # se l'audio non riesce, il testo viene pubblicato lo stesso (e arriva l'avviso)
      - name: Genera l'audio MP3 con la voce Paola
        if: steps.slot.outputs.audio == 'si'
        continue-on-error: true
        run: |
          TODAY="${{ steps.slot.outputs.today }}"
          SLOT="${{ steps.slot.outputs.slot }}"
          if [ "$SLOT" = "mattina" ] || [ ! -f "edizioni/$TODAY-$SLOT.html" ]; then
            # edizione del mattino (anche quando l'aggiornamento l'ha generata perché mancava)
            if [ -f "edizioni/$TODAY.html" ] && { [ "$SLOT" = "mattina" ] || [ ! -f "audio/$TODAY.mp3" ]; }; then
              python3 tools/build_audio.py --html "edizioni/$TODAY.html" --date "$TODAY" --out audio
            fi
          elif grep -q "<li" "edizioni/$TODAY-$SLOT.html"; then
            python3 tools/build_audio.py --html "edizioni/$TODAY-$SLOT.html" --date "$TODAY" \
              --name "$TODAY-$SLOT" --out audio \
              --intro "Rassegna dell'Emilia-Romagna. Ecco le notizie arrivate dopo l'ultima edizione."
          fi

      # GitHub Pages accetta al massimo circa 1 GB: l'audio più vecchio di AUDIO_DAYS giorni viene tolto
      - name: Toglie l'audio vecchio e aggiorna il podcast
        if: steps.slot.outputs.slot != 'salta'
        run: |
          LIMIT=$(TZ=Europe/Rome date -d "$AUDIO_DAYS days ago" +'%Y-%m-%d')
          for f in audio/????-??-??*.mp3 audio/????-??-??*.json; do
            [ -e "$f" ] || continue
            D=$(basename "$f" | cut -c1-10)
            if [[ "$D" < "$LIMIT" ]]; then rm -f "$f"; echo "tolto $f"; fi
          done
          python3 tools/podcast.py
          du -sh audio || true

      - name: Pubblica
        if: steps.slot.outputs.slot != 'salta'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 0) fotografia del sito completo (con gli MP3) PRIMA di toccare main:
          #    l'allineamento con GitHub potrebbe togliere dalla cartella i file non più tracciati
          SITE=$(mktemp -d)
          tar --exclude=./.git --exclude=./.github --exclude=./tools --exclude='__pycache__' -cf - . | tar -xf - -C "$SITE"
          touch "$SITE/.nojekyll"
          rm -f "$SITE/.gitignore"   # nel sito pubblicato gli MP3 devono esserci
          echo "Fotografia del sito: $(ls "$SITE"/audio/*.mp3 2>/dev/null | wc -l) audio"

          # 1) ramo main: testi, indici e dati (gli MP3 solo finché il sito non è servito da gh-pages)
          SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.source.branch' 2>/dev/null || echo "?")
          echo "Il sito è pubblicato dal ramo: $SOURCE"
          if [ "$SOURCE" = "gh-pages" ]; then
            grep -qx 'audio/\*.mp3' .gitignore 2>/dev/null || echo 'audio/*.mp3' >> .gitignore
            git rm -r -q --cached --ignore-unmatch 'audio/*.mp3'
            git add .gitignore
          fi
          for f in edizioni audio index.json stato.json ultimora.json podcast.xml; do
            [ -e "$f" ] && git add -A "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "Auto-update rassegna (${{ steps.slot.outputs.slot }})"
            for i in 1 2 3; do
              git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && break
              sleep 5
              [ "$i" = 3 ] && { echo "❌ Pubblicazione su main non riuscita"; exit 1; }
            done
          else
            echo "Nessuna novità da salvare in main."
          fi

          # 2) ramo gh-pages: il sito completo con gli MP3, in un solo commit senza storia
          cd "$SITE"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Sito pubblicato $(TZ=Europe/Rome date +'%Y-%m-%d %H:%M')"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "✅ Sito pubblicato su gh-pages ($(du -sh . | cut -f1))"

      # Notifica sul telefono (app ntfy): il topic è nel segreto NTFY_TOPIC del repository
      - name: Notifica sul telefono
        if: always() && steps.slot.outputs.slot != 'salta' && steps.slot.outputs.slot != 'sito'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 tools/notify.py "${{ steps.slot.outputs.slot }}" "${{ job.status }}" || true

      # ---------------------------------------------------------------------
      # Avviso automatico: se qualcosa non va apre una "issue" nel repository
      # (GitHub la manda per e-mail); al primo aggiornamento riuscito la chiude da sola.
      # ---------------------------------------------------------------------
      - name: Controllo e avviso
        if: always() && steps.slot.outputs.slot != 'salta' && steps.slot.outputs.slot != 'sito'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          python3 tools/check_health.py "$JOB_STATUS" "${{ steps.slot.outputs.slot }}"
          code=$?
          set -e
          cat health.md >> "$GITHUB_STEP_SUMMARY"
          TITLE="⚠️ Rassegna: aggiornamento non riuscito"
          OPEN=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "$code" = "1" ]; then
            {
              echo "@${{ github.repository_owner }}"
              echo
              cat health.md
            } > body.md
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "✅ Risolto: la pubblicazione delle $(TZ=Europe/Rome date +'%H:%M del %d/%m/%Y') è andata a buon fine."
          fi
