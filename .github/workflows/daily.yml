name: Rassegna Stampa Automatica

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze di sistema e pacchetti Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg dos2unix
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai gTTS

      - name: Genera Rassegna HTML e Audio MP3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TODAY=$(date +'%Y-%m-%d')
          
          FETCH_SCRIPT=$(find . -maxdepth 3 -iname "fetch_and_analyze.py" | head -n 1)
          BUILD_SCRIPT=$(find . -maxdepth 3 -iname "build_audio.py" | head -n 1)
          
          if [ -z "$FETCH_SCRIPT" ]; then
            echo "CRITICO: Impossibile trovare fetch_and_analyze.py nel repository."
            exit 1
          fi
          
          dos2unix "$FETCH_SCRIPT"
          if [ -n "$BUILD_SCRIPT" ]; then
            dos2unix "$BUILD_SCRIPT"
          fi
          
          python3 "$FETCH_SCRIPT"
          
          if [ -n "$BUILD_SCRIPT" ]; then
            python3 "$BUILD_SCRIPT" --html edizioni/$TODAY.html --date $TODAY --out audio
          fi
          
          echo "{\"latest\": \"$TODAY\"}" > index.json

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Sincronizzazione preventiva con il server
          git fetch origin main
          git pull origin main --rebase
          
          # 2. Aggiunta dei file generati
          git add -A
          
          # 3. Commit e Push sicuro con token e force-with-lease
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update rassegna $(date +'%Y-%m-%d')"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git main --force-with-lease
          else
            echo "Nessun cambiamento rilevato, skip del commit."
          fi
