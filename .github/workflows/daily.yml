name: Rassegna Stampa Automatica

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze di sistema e pacchetti Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg dos2unix
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai gTTS trafilatura

      - name: Genera Rassegna HTML e Audio MP3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TODAY=$(date +'%Y-%m-%d')
          
          FETCH_SCRIPT=$(find . -maxdepth 3 -iname "fetch_and_analyze.py" | head -n 1)
          BUILD_SCRIPT=$(find . -maxdepth 3 -iname "build_audio.py" | head -n 1)
          
          if [ -z "$FETCH_SCRIPT" ]; then
            echo "CRITICO: Impossibile trovare fetch_and_analyze.py nel repository."
            exit 1
          fi
          
          dos2unix "$FETCH_SCRIPT"
          if [ -n "$BUILD_SCRIPT" ]; then
            dos2unix "$BUILD_SCRIPT"
          fi
          
          # 1. Genera l'HTML dell'edizione di oggi
          python3 "$FETCH_SCRIPT"
          
          # 2. Genera l'audio MP3 e i metadati audio
          if [ -n "$BUILD_SCRIPT" ]; then
            python3 "$BUILD_SCRIPT" --html edizioni/$TODAY.html --date $TODAY --out audio
          fi
          
          # 3. Aggiorna solo index.json con la data odierna
          echo "{\"latest\": \"$TODAY\"}" > index.json

      - name: Commit e Push automatico sicuro
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update rassegna"
          branch: main
          file_pattern: 'edizioni/* audio/* index.json'
