name: Rassegna Stampa Automatica

on:
  schedule:
    - cron: '0 4 * * *'   # 06:00 ora legale italiana (05:00 con l'ora solare)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg dos2unix
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai trafilatura

      - name: Controlla che gli script siano completi
        run: |
          for f in tools/fetch_and_analyze.py tools/build_audio.py; do
            dos2unix -q "$f"
            python -m py_compile "$f" || { echo "❌ $f non è valido: ricaricalo per intero."; exit 1; }
            tail -3 "$f" | grep -q "main()" || { echo "❌ $f è incompleto: ricaricalo per intero."; exit 1; }
          done

      - name: Genera la rassegna (HTML)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/fetch_and_analyze.py

      - name: Genera l'audio MP3 con la voce Paola
        run: |
          TODAY=$(TZ=Europe/Rome date +'%Y-%m-%d')
          if [ -f "edizioni/$TODAY.html" ]; then
            python3 tools/build_audio.py --html "edizioni/$TODAY.html" --date "$TODAY" --out audio
          fi

      - name: Pubblica
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update rassegna"
          branch: main
          file_pattern: 'edizioni/* audio/* index.json'
