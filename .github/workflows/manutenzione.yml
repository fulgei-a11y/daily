name: Manutenzione
# esecuzioni e avvisi vecchi

on:
  push:
    branches: [main]
    paths: ['.github/workflows/manutenzione.yml']
  workflow_dispatch:

permissions:
  actions: write
  issues: write

jobs:
  pulizia:
    runs-on: ubuntu-24.04
    steps:
      - name: Pulizia
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set +e
          # esecuzioni concluse (tranne questa)
          n=0
          for id in $(gh api --paginate "repos/$R/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status=="completed") | .id'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh api -X DELETE "repos/$R/actions/runs/$id" >/dev/null 2>&1 && n=$((n+1))
          done
          echo "esecuzioni tolte: $n"
          # issue: titolo e testo generici, commenti tolti, chiuse
          for num in $(gh api --paginate "repos/$R/issues?state=all&per_page=100" --jq '.[] | select(.pull_request|not) | .number'); do
            for c in $(gh api --paginate "repos/$R/issues/$num/comments?per_page=100" --jq '.[].id'); do
              gh api -X DELETE "repos/$R/issues/comments/$c" >/dev/null 2>&1
            done
            gh api -X PATCH "repos/$R/issues/$num" -f title="avviso" -f body="-" -f state=closed >/dev/null 2>&1
          done
          echo "issue sistemate"
          # tentativo di cancellazione definitiva delle issue (serve il permesso di amministratore)
          for nid in $(gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){issues(first:100){nodes{id}}}}' -f o="${R%/*}" -f n="${R#*/}" --jq '.data.repository.issues.nodes[].id'); do
            gh api graphql -f query='mutation($id:ID!){deleteIssue(input:{issueId:$id}){clientMutationId}}' -f id="$nid" >/dev/null 2>&1 && echo "issue cancellata" || echo "issue non cancellabile con questo permesso"
          done
